<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India | Abhijith</title>
    <meta name="description" content="A gallery of India travel memories and photos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20261025-nobrand" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html#stories">Stories</a>
          <a href="index.html#destinations">Destinations</a>
          <a href="index.html#about">About</a>
          <a href="index.html#newsletter">Newsletter</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding: 3rem 0 4rem;">
      <section class="morocco-gallery-page">
        <div class="morocco-gallery-copy">
          <p class="eyebrow">India memories</p>
          <h1>Color, chaos, and warmth in equal measure.</h1>
          <p>India moved fast and stayed vivid — busy streets, quiet temples, and moments of stillness tucked between the noise.</p>
          <p class="morocco-quote">A country of bold color, endless flavor, and hospitality that never runs out.</p>
        </div>
        <div id="indiaGalleryGrid" class="morocco-gallery-grid" aria-label="India photo gallery"></div>
      </section>
    </main>

    <script src="india-gallery.js"></script>
    <script>
      const galleryGrid = document.getElementById('indiaGalleryGrid');

      if (galleryGrid && window.indiaGalleryImages) {
        window.indiaGalleryImages.forEach((fileName) => {
          const link = document.createElement('a');
          link.className = 'gallery-thumb';
          link.href = `images/${fileName}`;
          link.target = '_blank';
          link.rel = 'noopener';
          link.innerHTML = `<img src="images/${fileName}" alt="India photo ${fileName}" loading="lazy" />`;
          galleryGrid.appendChild(link);
        });
      }
    </script>
  </body>
</html>
